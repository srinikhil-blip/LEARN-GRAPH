version: "3.9"

services:
  # ── FastAPI Backend API ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learngraph_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── PostgreSQL with pgvector Extension ─────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learngraph_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learngraph
      POSTGRES_USER: learngraph
      POSTGRES_PASSWORD: learngraph_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learngraph -d learngraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Celery Broker ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: learngraph_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j AuraDB Local (Knowledge Graph) ───────────────────
  neo4j:
    image: neo4j:5.23
    container_name: learngraph_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data

  # ── Celery Asynchronous Task Worker ────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learngraph_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,email_queue,ai_queue,graph_queue

  # ── Celery Beat Scheduled Job Runner ───────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learngraph_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ── Flower: Celery Monitoring Dashboard ────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learngraph_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
